<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NPM Runner Icon Generator</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #1a1a2e;
        }
        .icon-container {
            width: 256px;
            height: 256px;
            margin-bottom: 20px;
        }
        canvas {
            border: 1px solid #333;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 6px;
        }
        button:hover {
            background: #45a049;
        }
        a {
            margin-top: 10px;
            color: #4fc3f7;
        }
    </style>
</head>
<body>
    <h1 style="color: white;">NPM Runner Icon</h1>
    <div class="icon-container">
        <canvas id="canvas" width="256" height="256"></canvas>
    </div>
    <button onclick="downloadPNG()">Download as PNG (256x256)</button>
    <p style="color: #888; margin-top: 20px;">Save as icon.png in the resources folder</p>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function drawIcon() {
            const size = 256;
            const scale = size / 128;
            
            ctx.save();
            ctx.scale(scale, scale);
            
            // Background circle
            const bgGrad = ctx.createLinearGradient(0, 0, 128, 128);
            bgGrad.addColorStop(0, '#1a1a2e');
            bgGrad.addColorStop(1, '#16213e');
            
            ctx.beginPath();
            ctx.arc(64, 64, 60, 0, Math.PI * 2);
            ctx.fillStyle = bgGrad;
            ctx.fill();
            
            // Flame gradient
            const flameGrad = ctx.createLinearGradient(64, 95, 64, 35);
            flameGrad.addColorStop(0, '#ff6b35');
            flameGrad.addColorStop(0.5, '#f7c531');
            flameGrad.addColorStop(1, '#ffeb3b');
            
            // Flame body
            ctx.beginPath();
            ctx.moveTo(64, 95);
            ctx.bezierCurveTo(45, 95, 35, 80, 35, 65);
            ctx.bezierCurveTo(35, 50, 45, 40, 50, 35);
            ctx.bezierCurveTo(52, 45, 58, 48, 62, 42);
            ctx.bezierCurveTo(60, 52, 65, 55, 70, 48);
            ctx.bezierCurveTo(72, 55, 80, 52, 82, 45);
            ctx.bezierCurveTo(88, 55, 93, 65, 93, 75);
            ctx.bezierCurveTo(93, 85, 83, 95, 64, 95);
            ctx.closePath();
            ctx.fillStyle = flameGrad;
            ctx.fill();
            
            // Inner flame glow
            ctx.beginPath();
            ctx.moveTo(64, 90);
            ctx.bezierCurveTo(50, 90, 45, 80, 45, 70);
            ctx.bezierCurveTo(45, 60, 55, 55, 58, 50);
            ctx.bezierCurveTo(60, 58, 65, 60, 68, 55);
            ctx.bezierCurveTo(70, 62, 78, 58, 80, 52);
            ctx.bezierCurveTo(85, 60, 88, 70, 88, 78);
            ctx.bezierCurveTo(88, 86, 78, 90, 64, 90);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255, 243, 224, 0.3)';
            ctx.fill();
            
            // Eyes
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.ellipse(52, 68, 6, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(76, 68, 6, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Eye highlights
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(50, 66, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(74, 66, 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Smile
            ctx.strokeStyle = '#1a1a2e';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(54, 78);
            ctx.quadraticCurveTo(64, 86, 74, 78);
            ctx.stroke();
            
            // npm badge
            ctx.fillStyle = '#cb3837';
            roundRect(ctx, 42, 98, 44, 16, 3);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 10px Arial Black';
            ctx.textAlign = 'center';
            ctx.fillText('npm', 64, 110);
            
            // Play button accent
            ctx.save();
            ctx.translate(90, 30);
            ctx.beginPath();
            ctx.arc(0, 0, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#4caf50';
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.moveTo(-4, -6);
            ctx.lineTo(-4, 6);
            ctx.lineTo(6, 0);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            
            // Node.js accent
            ctx.save();
            ctx.translate(25, 35);
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#68a063';
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 8px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('N', 0, 0);
            ctx.restore();
            
            ctx.restore();
        }
        
        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }
        
        function downloadPNG() {
            const link = document.createElement('a');
            link.download = 'icon.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        drawIcon();
    </script>
</body>
</html>
