<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NPM Runner CodeLens Screenshot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #cccccc;
            padding: 20px;
        }
        .window {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            max-width: 700px;
            margin: 0 auto;
        }
        .titlebar {
            background: #3c3c3c;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .titlebar-dots {
            display: flex;
            gap: 6px;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }
        .titlebar-title {
            flex: 1;
            text-align: center;
            font-size: 12px;
            color: #858585;
        }
        
        .editor {
            font-family: 'SF Mono', Consolas, 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            padding: 16px;
        }
        .line {
            display: flex;
        }
        .line-num {
            width: 40px;
            color: #858585;
            text-align: right;
            padding-right: 16px;
            user-select: none;
        }
        .line-content {
            flex: 1;
        }
        
        .codelens {
            display: flex;
            gap: 12px;
            padding: 4px 0 4px 56px;
            font-size: 12px;
        }
        .codelens-btn {
            color: #4ec9b0;
            cursor: pointer;
        }
        .codelens-btn:hover {
            text-decoration: underline;
        }
        .codelens-btn.debug {
            color: #dcdcaa;
        }
        
        .key { color: #9cdcfe; }
        .string { color: #ce9178; }
        .bracket { color: #ffd700; }
        .punctuation { color: #cccccc; }
        .comment { color: #6a9955; }
    </style>
</head>
<body>
    <div class="window">
        <div class="titlebar">
            <div class="titlebar-dots">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="titlebar-title">package.json - front</div>
        </div>
        
        <div class="editor">
            <div class="line">
                <span class="line-num">8</span>
                <span class="line-content">  <span class="key">"scripts"</span><span class="punctuation">:</span> <span class="bracket">{</span></span>
            </div>
            
            <div class="codelens">
                <span class="codelens-btn">▶ Run</span>
                <span class="codelens-btn debug">🐛 Debug</span>
            </div>
            <div class="line">
                <span class="line-num">9</span>
                <span class="line-content">    <span class="key">"dev"</span><span class="punctuation">:</span> <span class="string">"vite"</span><span class="punctuation">,</span></span>
            </div>
            
            <div class="codelens">
                <span class="codelens-btn">▶ Run</span>
                <span class="codelens-btn debug">🐛 Debug</span>
            </div>
            <div class="line">
                <span class="line-num">10</span>
                <span class="line-content">    <span class="key">"build"</span><span class="punctuation">:</span> <span class="string">"tsc && vite build"</span><span class="punctuation">,</span></span>
            </div>
            
            <div class="codelens">
                <span class="codelens-btn">▶ Run</span>
                <span class="codelens-btn debug">🐛 Debug</span>
            </div>
            <div class="line">
                <span class="line-num">11</span>
                <span class="line-content">    <span class="key">"preview"</span><span class="punctuation">:</span> <span class="string">"vite preview"</span><span class="punctuation">,</span></span>
            </div>
            
            <div class="codelens">
                <span class="codelens-btn">▶ Run</span>
                <span class="codelens-btn debug">🐛 Debug</span>
            </div>
            <div class="line">
                <span class="line-num">12</span>
                <span class="line-content">    <span class="key">"lint"</span><span class="punctuation">:</span> <span class="string">"eslint . --ext ts,tsx"</span><span class="punctuation">,</span></span>
            </div>
            
            <div class="codelens">
                <span class="codelens-btn">▶ Run</span>
                <span class="codelens-btn debug">🐛 Debug</span>
            </div>
            <div class="line">
                <span class="line-num">13</span>
                <span class="line-content">    <span class="key">"test"</span><span class="punctuation">:</span> <span class="string">"vitest"</span></span>
            </div>
            
            <div class="line">
                <span class="line-num">14</span>
                <span class="line-content">  <span class="bracket">}</span><span class="punctuation">,</span></span>
            </div>
        </div>
    </div>
</body>
</html>
